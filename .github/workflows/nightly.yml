name: Nightly

on:
  schedule:
    # The scheduled workflow must also exist on the repository default branch.
    # Manual dispatch can target dev before this file is merged to main.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-dev
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    name: Prepare nightly tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      release_body: ${{ steps.meta.outputs.release_body }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
    - name: Checkout dev
      uses: actions/checkout@v4
      with:
        ref: dev
        fetch-depth: 0

    - name: Compute nightly tag
      id: meta
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        git fetch origin --tags --force

        full_sha="$(git rev-parse HEAD)"
        short_sha="$(git rev-parse --short=7 HEAD)"
        date="$(date -u +%Y%m%d)"
        base_version="$(python - <<'PY'
        import re
        import subprocess
        from pathlib import Path

        versions = []
        project = Path("pyproject.toml").read_text(encoding="utf-8")
        match = re.search(r'^version\s*=\s*["\'](\d+\.\d+\.\d+)["\']', project, re.MULTILINE)
        if match:
            versions.append(tuple(map(int, match.group(1).split('.'))))
        for tag in subprocess.check_output(["git", "tag", "--list", "v*"], text=True).splitlines():
            match = re.fullmatch(r'v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?', tag.strip())
            if match:
                versions.append(tuple(map(int, match.group(1).split('.'))))
        if not versions:
            raise SystemExit("Unable to resolve a nightly base version")
        print('.'.join(map(str, max(versions))))
        PY
        )"

        ci_runs_file="${RUNNER_TEMP}/windows-ci-runs.json"
        if ! gh api \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          "repos/${GITHUB_REPOSITORY}/actions/workflows/test_windows.yml/runs?branch=dev&head_sha=${full_sha}&per_page=100" \
          > "${ci_runs_file}"; then
          echo "Unable to query Windows CI for ${full_sha}; skipping Nightly (fail closed)."
          echo "skip=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        ci_state="$(python - "${ci_runs_file}" "${full_sha}" <<'PY'
        import json
        import sys

        runs = json.load(open(sys.argv[1], encoding="utf-8")).get("workflow_runs", [])
        sha = sys.argv[2]
        matching = [run for run in runs if run.get("head_sha") == sha]
        successful = [run for run in matching if run.get("status") == "completed" and run.get("conclusion") == "success"]
        if successful:
            print("success")
        elif matching:
            statuses = sorted({f"{run.get('status')}/{run.get('conclusion')}" for run in matching})
            print("not-green:" + ",".join(statuses))
        else:
            print("missing")
        PY
        )"
        if [[ "${ci_state}" != "success" ]]; then
          echo "Windows CI is not green for dev HEAD ${full_sha} (${ci_state}); skipping Nightly."
          echo "skip=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        existing="$(git tag --list 'v*-nightly.*' --points-at "${full_sha}" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
        if [[ -n "${existing}" ]]; then
          echo "Commit ${full_sha} already has a nightly tag (${existing}); skipping."
          echo "skip=true" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        tag="v${base_version}-nightly.${date}.${short_sha}"
        {
          echo "release_tag=${tag}"
          echo "source_ref=${full_sha}"
          echo "skip=false"
          echo "release_body<<EOF"
          echo "Mozikit Desktop nightly pre-release built from dev."
          echo
          echo "- Base version: ${base_version}"
          echo "- Commit: ${full_sha}"
          echo "- Tag: ${tag}"
          echo "- Upgrade boundary: MSI preserves %LOCALAPPDATA%/Mozikit; Portable ZIP is manual replacement."
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"
        echo "Nightly tag: ${tag}"

  nightly:
    name: Build and publish nightly
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/build_windows.yml
    with:
      release_tag: ${{ needs.prepare.outputs.release_tag }}
      source_ref: ${{ needs.prepare.outputs.source_ref }}
      prerelease: true
      release_body: ${{ needs.prepare.outputs.release_body }}
    secrets: inherit
