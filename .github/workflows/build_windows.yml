name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string
      source_ref:
        description: "Commit, branch, or tag to build (defaults to the release tag)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release"
        required: false
        default: false
        type: boolean
      release_body:
        description: "Optional release description"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        type: string
      source_ref:
        description: "Commit, branch, or tag to build"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Publish as a GitHub pre-release"
        required: false
        default: false
        type: boolean
      release_body:
        description: "Optional release description"
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RESOLVED_REF: ${{ inputs.source_ref || inputs.release_tag || github.ref }}

jobs:
  build_windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHON_KEYRING_BACKEND: "keyring.backends.null.Keyring"
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout release ref
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RESOLVED_REF }}
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip

    - name: Install build and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[gui]"
        python -m pip install pytest-asyncio pyinstaller

    - name: Run tests
      run: python -m pytest -q

    - name: Resolve release metadata
      id: release_meta
      shell: pwsh
      run: |
        $tag = "${{ inputs.release_tag }}"
        if ([string]::IsNullOrWhiteSpace($tag)) {
          $tag = "${{ github.ref_name }}"
        }
        if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
          throw "Release tag must be a semantic version or pre-release beginning with v (got: $tag)."
        }
        $sourceRef = (git rev-parse HEAD).Trim()
        $version = $tag.Substring(1)
        $isNightly = $tag -match '-nightly\.\d{8}\.[0-9a-f]{7}$'
        $isPrerelease = $isNightly -or ("${{ inputs.prerelease }}" -eq "true")
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "source_ref=$sourceRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Release version: $version"
        Write-Host "Release source: $sourceRef"
        Write-Host "Pre-release: $isPrerelease"

    - name: Download and verify pinned UV
      shell: pwsh
      run: ./scripts/download_uv.ps1

    - name: Sync official nodes snapshot
      shell: pwsh
      run: |
        python tools/sync_official_nodes.py
        if (-not (Test-Path "official_nodes/manifest.json")) {
          throw "Official nodes snapshot was not generated."
        }

    - name: Build shared Desktop distribution
      shell: pwsh
      env:
        MOZIKIT_VERSION: ${{ steps.release_meta.outputs.version }}
        MOZIKIT_SKIP_OFFICIAL_NODES_SYNC: "1"
      run: python auto_build.py

    - name: Optional Authenticode signing for executables
      shell: pwsh
      env:
        MOZIKIT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_BASE64 }}
        MOZIKIT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        ./scripts/sign_windows.ps1 -Path @(
          "dist/Mozikit/MozikitDesktop.exe",
          "dist/Mozikit/mozikit.exe",
          "dist/Mozikit/runtime/uv.exe"
        )

    - name: Install WiX Toolset
      shell: pwsh
      run: choco install wixtoolset --no-progress -y

    - name: Build MSI installer
      shell: pwsh
      run: ./scripts/build_msi.ps1 -Tag "${{ steps.release_meta.outputs.tag }}"

    - name: Optional Authenticode signing for MSI
      shell: pwsh
      env:
        MOZIKIT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_BASE64 }}
        MOZIKIT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_PASSWORD }}
      run: ./scripts/sign_windows.ps1 -Path "release/mozikit-${{ steps.release_meta.outputs.tag }}-x64.msi"

    - name: Verify release layout and CLI smoke contract
      shell: pwsh
      run: |
        $smokeRoot = Join-Path $env:RUNNER_TEMP "mozikit-release-smoke"
        $env:MOZIKIT_APP_DATA_DIR = Join-Path $smokeRoot "appdata"
        $env:MOZIKIT_WORKSPACE = Join-Path $smokeRoot "workflows"
        & .\dist\Mozikit\mozikit.exe --version
        if ($LASTEXITCODE -ne 0) { throw "mozikit --version failed" }
        & .\dist\Mozikit\mozikit.exe --help | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "mozikit --help failed" }
        & .\dist\Mozikit\mozikit.exe update --status --json | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "mozikit update --status failed" }
        & .\dist\Mozikit\runtime\uv.exe --version
        if ($LASTEXITCODE -ne 0) { throw "bundled uv --version failed" }
        foreach ($path in @(
          "dist/Mozikit/MozikitDesktop.exe",
          "dist/Mozikit/mozikit.exe",
          "dist/Mozikit/runtime/uv.exe",
          "dist/Mozikit/official_nodes/manifest.json"
        )) {
          if (-not (Test-Path $path)) { throw "Missing release entry: $path" }
        }

    - name: Create portable ZIP
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release | Out-Null
        if (Test-Path "release/Mozikit-Windows-x64.zip") {
          Remove-Item -LiteralPath "release/Mozikit-Windows-x64.zip" -Force
        }
        Compress-Archive -Path "dist/Mozikit" -DestinationPath "release/Mozikit-Windows-x64.zip" -CompressionLevel Optimal

    - name: Generate update manifest
      shell: pwsh
      env:
        MOZIKIT_RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        MOZIKIT_RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        MOZIKIT_RELEASE_SOURCE_REF: ${{ steps.release_meta.outputs.source_ref }}
        MOZIKIT_RELEASE_BUILD_SEQUENCE: ${{ github.run_number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python scripts/generate_update_manifest.py `
          --release-dir release `
          --tag $env:MOZIKIT_RELEASE_TAG `
          --version $env:MOZIKIT_RELEASE_VERSION `
          --source-ref $env:MOZIKIT_RELEASE_SOURCE_REF `
          --repository $env:GITHUB_REPOSITORY `
          --build-sequence ([int]$env:MOZIKIT_RELEASE_BUILD_SEQUENCE)

    - name: Calculate SHA256SUMS
      shell: pwsh
      run: |
        $lines = @()
        foreach ($artifact in Get-ChildItem -LiteralPath "release" -File | Where-Object { $_.Extension -in @(".msi", ".zip", ".json") -and $_.Name -ne "SHA256SUMS" } | Sort-Object Name) {
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$hash  $($artifact.Name)"
        }
        if ($lines.Count -lt 3) { throw "Expected MSI, ZIP, and update manifest release assets" }
        Set-Content -LiteralPath "release/SHA256SUMS" -Value $lines -Encoding ascii
        Get-Content -LiteralPath "release/SHA256SUMS"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mozikit-release-assets
        path: release/
        retention-days: 7

  publish_release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build_windows
    permissions:
      contents: write
    steps:
    - name: Checkout release ref
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RESOLVED_REF }}

    - name: Resolve release tag
      id: release_meta
      shell: bash
      env:
        INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        INPUT_PRERELEASE: ${{ inputs.prerelease }}
        INPUT_RELEASE_BODY: ${{ inputs.release_body }}
      run: |
        set -euo pipefail
        tag="${INPUT_RELEASE_TAG:-${GITHUB_REF_NAME}}"
        [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag: ${tag}" >&2; exit 1; }
        source_ref="$(git rev-parse HEAD)"
        prerelease=false
        [[ "${tag}" =~ -nightly\.[0-9]{8}\.[0-9a-f]{7}$ ]] && prerelease=true
        [[ "${INPUT_PRERELEASE}" == "true" ]] && prerelease=true
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
        echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
        if [[ -n "${INPUT_RELEASE_BODY:-}" ]]; then
          {
            echo "release_body<<EOF"
            printf '%s\n' "${INPUT_RELEASE_BODY}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        name: mozikit-release-assets
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_meta.outputs.tag }}
        target_commitish: ${{ steps.release_meta.outputs.source_ref }}
        files: |
          release/Mozikit-Windows-x64.zip
          release/mozikit-*-x64.msi
          release/SHA256SUMS
          release/update-manifest.json
        draft: false
        prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
        generate_release_notes: ${{ steps.release_meta.outputs.prerelease != 'true' }}
        body: ${{ steps.release_meta.outputs.release_body }}
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-telegram:
    name: Telegram 通知
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build_windows
      - publish_release
    steps:
    - name: Send Telegram message
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TAG: ${{ inputs.release_tag || github.ref_name }}
        BUILD_RESULT: ${{ needs.build_windows.result }}
        PUBLISH_RESULT: ${{ needs.publish_release.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.release_tag || github.ref_name }}
      run: |
        set -euo pipefail
        if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
          echo "TELEGRAM_TOKEN 或 TELEGRAM_CHAT_ID 未配置，跳过通知。"
          exit 0
        fi
        if [ "$PUBLISH_RESULT" = "success" ]; then
          text="Mozikit ${TAG} 发布成功\nRelease: ${RELEASE_URL}\n构建: ${RUN_URL}"
        else
          text="Mozikit ${TAG} 发版未完成\nbuild: ${BUILD_RESULT}\npublish: ${PUBLISH_RESULT}\n构建: ${RUN_URL}"
        fi
        payload="$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$text" '{chat_id:$chat, text:$text, disable_web_page_preview:false}')"
        curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -H "Content-Type: application/json" --data "$payload" | jq -e '.ok == true' >/dev/null
