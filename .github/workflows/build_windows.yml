name: Build Windows Release

on:
  push:
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (for example: v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RESOLVED_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

jobs:
  build_windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout release ref
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RESOLVED_REF }}
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip

    - name: Install build and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -e ".[gui]"
        python -m pip install pyinstaller

    - name: Run tests
      run: python -m pytest -q

    - name: Resolve release metadata
      id: release_meta
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $tag = "${{ github.event.inputs.release_tag }}"
        }
        if ($tag -notmatch '^v\d+\.\d+\.\d+') {
          throw "Release tag must be a semantic version beginning with v (got: $tag)."
        }
        $version = $tag.Substring(1)
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Release version: $version"

    - name: Download and verify pinned UV
      shell: pwsh
      run: ./scripts/download_uv.ps1

    - name: Sync official nodes snapshot
      shell: pwsh
      run: |
        python tools/sync_official_nodes.py
        if (-not (Test-Path "official_nodes/manifest.json")) {
          throw "Official nodes snapshot was not generated."
        }

    - name: Build shared Desktop distribution
      shell: pwsh
      env:
        MOZIKIT_VERSION: ${{ steps.release_meta.outputs.version }}
        MOZIKIT_SKIP_OFFICIAL_NODES_SYNC: "1"
      run: python auto_build.py

    - name: Optional Authenticode signing for executables
      shell: pwsh
      env:
        MOZIKIT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_BASE64 }}
        MOZIKIT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        ./scripts/sign_windows.ps1 -Path @(
          "dist/Mozikit/MozikitDesktop.exe",
          "dist/Mozikit/mozikit.exe",
          "dist/Mozikit/runtime/uv.exe"
        )

    - name: Install WiX Toolset
      shell: pwsh
      run: choco install wixtoolset --no-progress -y

    - name: Build MSI installer
      shell: pwsh
      run: ./scripts/build_msi.ps1 -Tag "${{ steps.release_meta.outputs.tag }}"

    - name: Optional Authenticode signing for MSI
      shell: pwsh
      env:
        MOZIKIT_SIGNING_CERTIFICATE_BASE64: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_BASE64 }}
        MOZIKIT_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MOZIKIT_SIGNING_CERTIFICATE_PASSWORD }}
      run: ./scripts/sign_windows.ps1 -Path "release/mozikit-${{ steps.release_meta.outputs.tag }}-x64.msi"

    - name: Verify release layout and CLI smoke contract
      shell: pwsh
      run: |
        $smokeRoot = Join-Path $env:RUNNER_TEMP "mozikit-release-smoke"
        $env:MOZIKIT_APP_DATA_DIR = Join-Path $smokeRoot "appdata"
        $env:MOZIKIT_WORKSPACE = Join-Path $smokeRoot "workflows"
        & .\dist\Mozikit\mozikit.exe --version
        if ($LASTEXITCODE -ne 0) { throw "mozikit --version failed" }
        & .\dist\Mozikit\mozikit.exe --help | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "mozikit --help failed" }
        & .\dist\Mozikit\runtime\uv.exe --version
        if ($LASTEXITCODE -ne 0) { throw "bundled uv --version failed" }
        foreach ($path in @(
          "dist/Mozikit/MozikitDesktop.exe",
          "dist/Mozikit/mozikit.exe",
          "dist/Mozikit/runtime/uv.exe",
          "dist/Mozikit/official_nodes/manifest.json"
        )) {
          if (-not (Test-Path $path)) { throw "Missing release entry: $path" }
        }

    - name: Create portable ZIP
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release | Out-Null
        if (Test-Path "release/Mozikit-Windows-x64.zip") {
          Remove-Item -LiteralPath "release/Mozikit-Windows-x64.zip" -Force
        }
        Compress-Archive -Path "dist/Mozikit" -DestinationPath "release/Mozikit-Windows-x64.zip" -CompressionLevel Optimal

    - name: Calculate SHA256SUMS
      shell: pwsh
      run: |
        $lines = @()
        foreach ($artifact in Get-ChildItem -LiteralPath "release" -File | Where-Object { $_.Extension -in @(".msi", ".zip") } | Sort-Object Name) {
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines += "$hash  $($artifact.Name)"
        }
        if ($lines.Count -lt 2) { throw "Expected MSI and ZIP release assets" }
        Set-Content -LiteralPath "release/SHA256SUMS" -Value $lines -Encoding ascii
        Get-Content -LiteralPath "release/SHA256SUMS"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mozikit-release-assets
        path: release/
        retention-days: 7

  publish_release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build_windows
    permissions:
      contents: write
    steps:
    - name: Checkout release ref
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RESOLVED_REF }}

    - name: Resolve release tag
      id: release_meta
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
          tag="${{ github.event.inputs.release_tag }}"
        else
          tag="${GITHUB_REF_NAME}"
        fi
        [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "Invalid release tag: ${tag}" >&2; exit 1; }
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"

    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        name: mozikit-release-assets
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_meta.outputs.tag }}
        files: |
          release/Mozikit-Windows-x64.zip
          release/mozikit-*-x64.msi
          release/SHA256SUMS
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit_winget:
    name: Submit WinGet manifest
    runs-on: windows-latest
    needs: publish_release
    steps:
    - name: Checkout release ref
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RESOLVED_REF }}

    - name: Resolve release metadata
      id: release_meta
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $tag = "${{ github.event.inputs.release_tag }}"
        }
        if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Invalid release tag: $tag" }
        "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Validate WINGET_TOKEN is configured
      shell: pwsh
      env:
        WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) { throw "Missing WINGET_TOKEN secret." }

    - name: Install wingetcreate
      shell: pwsh
      run: winget install --id Microsoft.WingetCreate -e --source winget --accept-package-agreements --accept-source-agreements

    - name: Download MSI for manifest generation
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "release" | Out-Null
        $tag = "${{ steps.release_meta.outputs.tag }}"
        $url = "https://github.com/${{ github.repository }}/releases/download/$tag/mozikit-$tag-x64.msi"
        Invoke-WebRequest -Uri $url -OutFile "release/mozikit-$tag-x64.msi"

    - name: Generate WinGet manifests
      shell: pwsh
      run: ./scripts/generate_winget_manifest.ps1 -Tag "${{ steps.release_meta.outputs.tag }}" -Repository "${{ github.repository }}" -MsiPath "release/mozikit-${{ steps.release_meta.outputs.tag }}-x64.msi"

    - name: Submit to winget-pkgs
      shell: pwsh
      env:
        WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      run: |
        $version = "${{ steps.release_meta.outputs.version }}"
        $manifestDir = ".\winget-manifests\manifests\l\Mozikit\Mozikit\$version"
        wingetcreate submit --prtitle "Add Mozikit.Mozikit $version" --token $env:WINGET_TOKEN --no-open $manifestDir

  notify-telegram:
    name: Telegram 通知
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build_windows
      - publish_release
      - submit_winget
    steps:
    - name: Send Telegram message
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        BUILD_RESULT: ${{ needs.build_windows.result }}
        PUBLISH_RESULT: ${{ needs.publish_release.result }}
        WINGET_RESULT: ${{ needs.submit_winget.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      run: |
        set -euo pipefail
        if [ -z "${TELEGRAM_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
          echo "TELEGRAM_TOKEN 或 TELEGRAM_CHAT_ID 未配置，跳过通知。"
          exit 0
        fi
        if [ "$PUBLISH_RESULT" = "success" ]; then
          text="Mozikit ${TAG} 发布成功\nRelease: ${RELEASE_URL}\n构建: ${RUN_URL}"
        else
          text="Mozikit ${TAG} 发版未完成\nbuild: ${BUILD_RESULT}\npublish: ${PUBLISH_RESULT}\nwinget: ${WINGET_RESULT}\n构建: ${RUN_URL}"
        fi
        payload="$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$text" '{chat_id:$chat, text:$text, disable_web_page_preview:false}')"
        curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -H "Content-Type: application/json" --data "$payload" | jq -e '.ok == true' >/dev/null
