name: Test (Linux)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-* libdbus-1-3 libgomp1

      - name: Install Python dependencies
        run: |
          pip install -e ".[test,gui,serve]"

      - name: Create official_nodes directory
        run: |
          mkdir -p official_nodes
          echo '{"repo_name":"mozikit-official-nodes","repo_version":"0.0.0","nodes":{}}' > official_nodes/manifest.json

      - name: Run functional and acceptance coverage
        run: |
          python -m pytest -q -m "not packaged and not live and not windows and not performance" --cov=src --cov-branch --cov-report=json:coverage.json --junitxml=tests.xml --acceptance-report=acceptance.json
          python tools/check_coverage.py coverage.json
          python tools/check_acceptance.py acceptance.json

      - name: Run performance without coverage
        run: python -m pytest test/unit/test_cli_performance.py -q

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.python-version }}-verification
          path: |
            coverage.json
            tests.xml
            acceptance.json
